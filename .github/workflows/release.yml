name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: kernwatch-linux-x86_64
          - target: x86_64-unknown-linux-musl
            asset: kernwatch-linux-x86_64-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate version tag
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M)[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml version'
          PY
      - name: Install toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --target '${{ matrix.target }}'
          rustup default 1.98.0
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Validate and build
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target '${{ matrix.target }}' -- -D warnings
          cargo test --locked --target '${{ matrix.target }}'
          cargo build --locked --release --target '${{ matrix.target }}'
      - name: Exercise release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/release
          cp "target/$TARGET/release/kernwatch" target/release/kernwatch
          ./target/release/kernwatch --help
          ./target/release/kernwatch --demo --snapshot > /tmp/kernwatch-demo.json
          python3 -m json.tool /tmp/kernwatch-demo.json > /dev/null
          python3 scripts/pty_smoke.py
          python3 scripts/demo_smoke.py
          if [ "$TARGET" = x86_64-unknown-linux-musl ]; then
            if readelf -l target/release/kernwatch | grep -q INTERP; then
              echo 'Static binary unexpectedly has a dynamic interpreter'
              exit 1
            fi
            if readelf -d target/release/kernwatch | grep -q NEEDED; then
              echo 'Static binary unexpectedly requires shared libraries'
              exit 1
            fi
          fi
      - name: Package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp target/release/kernwatch "$ASSET"
          tar -czf "dist/$ASSET.tar.gz" "$ASSET" LICENSE README.md
          cd dist
          sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "kernwatch $RELEASE_TAG" --notes-file ../docs/RELEASE_NOTES.md ./*.tar.gz ./*.sha256 SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
