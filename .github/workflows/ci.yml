name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probes:
    uses: ./.github/workflows/probes.yml
  check:
    needs: probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bpf-probes
          path: probes
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Terminal smoke test
        run: python3 scripts/pty_smoke.py
      - name: Dirty rendering and input latency
        run: python3 scripts/observer_smoke.py
      - name: Guided demo smoke test
        run: python3 scripts/demo_smoke.py
