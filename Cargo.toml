[package]
name = "kernwatch"
version = "0.4.1"
edition = "2021"
description = "Linux kernel observability in a Rust and Ratatui terminal"
repository = "https://github.com/matthart1983/kernwatch"
readme = "README.md"
rust-version = "1.98"
license = "MIT"
categories = ["command-line-utilities", "os::linux-apis"]
keywords = ["linux", "ebpf", "observability", "tui", "kernel"]
exclude = ["screenshots/", "docs/reference/"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
aya = "0.14"
rustc-demangle = "0.1"
cpp_demangle = "0.5.1"
