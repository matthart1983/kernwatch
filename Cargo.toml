[package]
name = "kernwatch"
version = "0.3.0"
edition = "2021"
description = "Linux kernel observability in a Rust and Ratatui terminal"
repository = "https://github.com/matthart1983/kernwatch"
readme = "README.md"
rust-version = "1.98"
license = "MIT"

[dependencies]
ratatui = "0.27"
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.13.1"
